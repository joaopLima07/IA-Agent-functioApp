spring.datasource.url=${DATABASE_URL}
spring.datasource.driverClassName=org.postgresql.Driver
# Supabase session pooler allows only 15 clients in total, so keep this app's pool small.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
jwt.secret=${JWT}
spring.ai.model.chat=google-genai
spring.ai.model.embedding=none
spring.mail.properties.mail.smtp.auth=true
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.ai.google.genai.api-key=${GEMINI_API_KEY}

# Front (Static Web Apps) and API are on different sites, so the refresh cookie must be
# SameSite=None; Secure. CORS origins are configured on the Function App itself.
refresh-token.cookie-secure=true
refresh-token.cookie-same-site=None


