spring.datasource.url=jdbc:postgresql://${HOST}:${PORT}/${DATABASE}?sslmode=require
spring.datasource.username=${USER}
spring.datasource.password=${PASSWORD}
spring.datasource.driverClassName=org.postgresql.Driver
jwt.secret=${JWT}
spring.ai.model.chat=google-genai
spring.ai.model.embedding=none
spring.mail.properties.mail.smtp.auth=true
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.ai.google.genai.api-key=${GEMINI_API_KEY}

# Front (Static Web Apps) and API are on different sites, so the refresh cookie must be
# SameSite=None; Secure. CORS origins are configured on the Function App itself.
refresh-token.cookie-secure=true
refresh-token.cookie-same-site=None


