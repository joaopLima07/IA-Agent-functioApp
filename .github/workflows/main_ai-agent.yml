name: Build and deploy Spring Boot (custom handler) to Azure Function App - AI-Agent

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_NAME: AI-Agent
  JAVA_VERSION: '21'

# evita que dois deploys rodem juntos e um sobrescreva o pacote do outro
concurrency:
  group: deploy-ai-agent
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # necessario para o login OIDC no Azure
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Build do jar
        run: mvn -B clean package -DskipTests

      - name: Monta o pacote do Function App
        run: |
          rm -rf package
          mkdir -p package
          cp -r azure-function/. package/
          cp target/*.jar package/app.jar
          # start.sh usa ./jre se existir (o Function App nao garante Java no custom handler)
          jlink --add-modules ALL-MODULE-PATH --strip-debug --no-man-pages --no-header-files --compress=zip-6 --output package/jre
          chmod +x package/start.sh
          ls -la package

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_64944047E90A4687A089E161C8F868A3 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_1BA2A32A8DFF40749C96331C86288AC5 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_F3B4518A459442298566D945F9398B2A }}

      - name: Deploy no Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          slot-name: Production
          package: package
