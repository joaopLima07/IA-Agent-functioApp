# Docs for the Azure Functions Action: https://github.com/Azure/functions-action
# More GitHub Actions for Azure: https://github.com/Azure/actions

# O Spring Boot roda como "custom handler": o Azure sobe o app.jar (azure-function/start.sh)
# e repassa as requisicoes HTTP para ele.
name: Build and deploy Spring Boot to Azure Function App - AI-Agent

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_NAME: AI-Agent # set this to your function app name on Azure
  JAVA_VERSION: '21' # set this to the java version to use

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: 'Checkout GitHub Action'
        uses: actions/checkout@v4

      - name: Setup Java Sdk ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'microsoft'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Assemble the Function package (custom handler)
        run: |
          mkdir -p package/proxy
          cp azure-function/host.json azure-function/start.sh package/
          cp azure-function/proxy/function.json package/proxy/
          cp target/*.jar package/app.jar

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_FC13E7F182A147C4B6092CF7C76ACD94 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_B5AFB791740E42D480296BEE7002F2D7 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_4D4726A159A94A7B97AE9AC9C0FE8908 }}

      - name: 'Run Azure Functions Action'
        uses: Azure/functions-action@v1
        id: fa
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          slot-name: 'Production'
          package: 'package'
